name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest

    # Scramble reads column types from the database to document models, so exporting the spec
    # needs the same Postgres as local development. Matches apps/api/.env.example.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: lockmate
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl
          # Xdebug, for the branch coverage of the health maths (RULES §7).
          coverage: xdebug

      - name: Install API dependencies
        working-directory: apps/api
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare API environment
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan migrate --force --no-interaction

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run lint typecheck test build

      # Health maths must have 100% branch coverage (RULES §7, ADR 0007).
      - name: Health maths branch coverage
        working-directory: apps/api
        run: composer test:health

      # The build re-exports openapi.json from the API code; a diff means the committed spec is stale (ADR 0003).
      - name: Generated files are up to date
        run: git diff --exit-code
