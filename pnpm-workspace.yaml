packages:
  - apps/*
  - packages/*

# Dependency install scripts are off unless listed. These two ship prebuilt binaries; their scripts are fallbacks.
allowBuilds:
  '@parcel/watcher': false
  unrs-resolver: false

peerDependencyRules:
  allowedVersions:
    # openapi-typescript declares TypeScript 5 but works with the repo's 6.0 (packages/config README).
    openapi-typescript>typescript: '6'

overrides:
  # One React version across the repo. Expo SDK 58 pins react 19.3.0, and its runtime pulls
  # react-dom in as a peer, so react-dom must match it.
  react-dom: 19.3.0
